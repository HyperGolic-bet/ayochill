<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AYO Chill</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Inter', sans-serif;
  color:#fff;
  overflow:hidden;
  text-align:center;
}

/* 🌈 Professional Gradient */
body::before {
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background: linear-gradient(120deg,#0f2027,#203a43,#2c5364);
  animation: bgMove 15s ease infinite;
  z-index:-2;
}

@keyframes bgMove {
  0% {transform:translate(0,0);}
  50% {transform:translate(-25%,-25%);}
  100% {transform:translate(0,0);}
}

/* ✨ Particles */
canvas {
  position:absolute;
  top:0;
  left:0;
  z-index:-1;
}

/* 💎 Glass Card */
.container {
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  padding: 40px 30px;
  box-shadow: 0 0 40px rgba(0,0,0,0.3);
  animation: fadeUp 1.5s ease;
}

/* 🎯 Title */
h1 {
  font-family:'Orbitron', sans-serif;
  font-size:4rem;
  letter-spacing:4px;
  margin-bottom:20px;
}

/* Subtitle */
p {
  opacity:0.7;
  margin-bottom:30px;
}

/* 🔴 Button */
.youtube-btn {
  display:inline-block;
  font-size:1.2rem;
  font-weight:600;
  padding:14px 30px;
  border-radius:10px;
  background:#ff0000;
  color:#fff;
  text-decoration:none;
  transition: all 0.3s ease;
}

.youtube-btn:hover {
  transform:scale(1.08);
  box-shadow:0 0 25px rgba(255,0,0,0.7);
}

/* Animation */
@keyframes fadeUp {
  from {opacity:0; transform:translateY(40px);}
  to {opacity:1; transform:translateY(0);}
}

/* 📱 Mobile */
@media(max-width:600px){
  h1 {font-size:2.5rem;}
  .container {padding:25px;}
}

</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="container">
  <h1>AYO Chill</h1>
  <p>Cool stuff. No stress.</p>

  <a class="youtube-btn" href="https://youtu.be/QDia3e12czc?si=IPScgdnjpuNKOBWa" target="_blank">
    AYO Chill!!
  </a>
</div>

<!-- 🔊 Click Sound -->
<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-09.mp3"></audio>

<!-- 🎧 Ambient Sound (very light, optional autoplay blocked sometimes) -->
<audio id="bgSound" src="https://www.soundjay.com/ambient/sounds/ambient-1.mp3" loop></audio>

<script>

/* 🔊 Play click sound */
document.querySelector(".youtube-btn").addEventListener("click", () => {
  document.getElementById("clickSound").play();
});

/* 🎧 Try to play ambient sound on first click */
document.body.addEventListener("click", () => {
  document.getElementById("bgSound").play();
}, { once: true });

/* ✨ Particle System */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];

class Particle {
  constructor(){
    this.x = Math.random()*canvas.width;
    this.y = Math.random()*canvas.height;
    this.size = Math.random()*2;
    this.speedX = (Math.random()-0.5)*0.5;
    this.speedY = (Math.random()-0.5)*0.5;
  }

  update(){
    this.x += this.speedX;
    this.y += this.speedY;
  }

  draw(){
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
  }
}

function init(){
  for(let i=0;i<80;i++){
    particlesArray.push(new Particle());
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particlesArray.forEach(p=>{
    p.update();
    p.draw();
  });
  requestAnimationFrame(animate);
}

init();
animate();

/* Resize fix */
window.addEventListener("resize",()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

</script>

</body>
</html>
